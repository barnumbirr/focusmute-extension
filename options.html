<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FocusMute Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      padding: 16px;
      max-width: 360px;
      color: #333;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
    }
    input[type="number"] {
      width: 100px;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .hint {
      color: #666;
      font-size: 12px;
      margin-top: 4px;
    }
    .actions {
      margin-top: 12px;
    }
    button {
      padding: 6px 16px;
      border: none;
      border-radius: 4px;
      background: #3c82d2;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #2d6bb5;
    }
    .status {
      margin-top: 8px;
      font-size: 12px;
      color: #080;
    }
    hr {
      border: none;
      border-top: 1px solid #ddd;
      margin: 20px 0;
    }
    ul {
      margin: 8px 0;
      padding-left: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h2>FocusMute Settings</h2>
  <label for="port">Port</label>
  <input type="number" id="port" min="0" max="65535" placeholder="9736">
  <div class="hint">Must match the port in FocusMute desktop app settings. 0 = disabled.</div>
  <div class="actions">
    <button id="save">Save</button>
  </div>
  <div class="status" id="status"></div>

  <div id="perm-section" hidden>
    <hr>
    <h2>Site access</h2>
    <div class="hint">
      FocusMute cannot read mute state on these sites until you allow it.
      Firefox grants site access when an extension is installed, so sites
      added by a later update stay blocked until they are allowed.
    </div>
    <ul id="perm-list"></ul>
    <div class="actions">
      <button id="grant">Allow these sites</button>
    </div>
    <div class="status" id="perm-status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
