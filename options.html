<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FocusMute Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      padding: 16px;
      max-width: 360px;
      color: #333;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
    }
    input[type="number"] {
      width: 100px;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .hint {
      color: #666;
      font-size: 12px;
      margin-top: 4px;
    }
    .actions {
      margin-top: 12px;
    }
    button {
      padding: 6px 16px;
      border: none;
      border-radius: 4px;
      background: #3c82d2;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #2d6bb5;
    }
    .status {
      margin-top: 8px;
      font-size: 12px;
      color: #080;
    }
  </style>
</head>
<body>
  <h2>FocusMute Settings</h2>
  <label for="port">Port</label>
  <input type="number" id="port" min="0" max="65535" placeholder="9736">
  <div class="hint">Must match the port in FocusMute desktop app settings. 0 = disabled.</div>
  <div class="actions">
    <button id="save">Save</button>
  </div>
  <div class="status" id="status"></div>
  <script src="options.js"></script>
</body>
</html>
