name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: web-ext lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install web-ext
        run: npm install --global web-ext@10

      - name: Run tests
        # Explicit paths rather than a glob: glob arguments to `node --test`
        # are version-sensitive across Node releases.
        run: node --test tests/content-scripts.test.js tests/options.test.js

      - name: Lint extension
        # --self-hosted permits gecko.update_url, which is required for
        # self-distributed (AMO unlisted) add-ons and forbidden for listed ones.
        run: web-ext lint --source-dir . --self-hosted --ignore-files "tests" "tests/**"
